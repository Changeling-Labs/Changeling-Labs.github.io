<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=/pulse/">
    <link rel="canonical" href="https://changelinglabs.com/pulse/">
    <title>Iron Log has moved to Pulse</title>
    <script>window.location.replace('/pulse/');</script>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0b1020;
            color: #e7ecf5;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        main { max-width: 28rem; }
        h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
        p { color: #a9b4c7; line-height: 1.6; margin: 0 0 1.5rem; }
        a {
            display: inline-block;
            background: #0056d2;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
        }
        a:hover { background: #0047ad; }
    </style>
</head>
<body>
    <main>
        <h1>Iron Log is now Pulse</h1>
        <p>That app has been retired. Your training tools live on in Pulse, with your existing history kept in place.</p>
        <a href="/pulse/">Continue to Pulse</a>
    </main>

</html>
